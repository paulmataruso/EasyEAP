# EasyEAP accepts Kerberos tickets for Group Policy autoenrollment with each tenant's keytab
# (docs/plans/gpo-autoenrollment.md). It never contacts a KDC, so no realms are configured here.
[libdefaults]
    dns_lookup_kdc = false
    dns_lookup_realm = false
    rdns = false
    dns_canonicalize_hostname = false
    # AES only: Windows is retiring RC4 for Kerberos, and the service account is created with AES keys.
    permitted_enctypes = aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96 aes256-cts-hmac-sha384-192 aes128-cts-hmac-sha256-128
