[project]
name = "easyeap"
version = "1.1.0"
description = "EasyEAP — Enterprise Wi-Fi Authentication, Simplified."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "httpx>=0.27",
  "cryptography>=43",
  "ldap3>=2.9",
  "python-multipart>=0.0.12",
  "pyrage>=1.2",  # age encryption for backups (binding to the maintained rage implementation)
  "gssapi>=1.9,<2",  # Kerberos acceptor for Group Policy autoenrollment (built in the image's first stage)
]

[project.scripts]
easyeap = "app.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs the dev PostgreSQL + OpenBao stack (EASYEAP_TEST_INTEGRATION=1)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "BLE", "UP", "RUF", "S", "FURB"]
# B008: FastAPI's Depends()/Query() in defaults is the framework idiom.
# RUF001-003: curly quotes and en dashes in user-facing strings are intentional.
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108", "S314", "S603", "S607"]
