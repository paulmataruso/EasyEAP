[project]
name = "easyeap"
version = "0.1.0"
description = "EasyEAP — Enterprise Wi-Fi Authentication, Simplified."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "httpx>=0.27",
  "cryptography>=43",
  "ldap3>=2.9",
  "python-multipart>=0.0.12",
]

[project.scripts]
easyeap = "app.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs the dev PostgreSQL + OpenBao stack (EASYEAP_TEST_INTEGRATION=1)"]

[tool.ruff]
line-length = 120
target-version = "py312"
