# Dependabot proposes routine updates once a month, grouped so each ecosystem opens at most one pull request.
# Major versions (TypeScript 6, React 20, FreeRADIUS 4, a new PostgreSQL client and so on) are never proposed:
# they change behaviour and are upgraded by hand, with the end-to-end test. Fixes for published vulnerabilities come
# separately, from Dependabot security updates (enabled in the repository settings).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      javascript:
        patterns: ["*"]

  # Base images: the API (python), the RADIUS server (freeradius) and the proxy (node build stage, nginx).
  - package-ecosystem: docker
    directories: [/backend, /services/radius, /deploy/proxy]
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      base-images:
        patterns: ["*"]
