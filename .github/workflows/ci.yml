name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint and tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check app tests
      - name: Unit tests
        run: pytest
      - name: RADIUS agent compiles
        run: python -m py_compile ../services/radius/agent/*.py

  frontend:
    name: Frontend (types, lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build

  images:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate the Compose file
        working-directory: deploy
        run: docker compose --env-file .env.example config --quiet
      - name: Build the API, RADIUS and proxy images
        working-directory: deploy
        run: docker compose --env-file .env.example build easyeap-api easyeap-radius easyeap-proxy

  radius:
    name: RADIUS (FreeRADIUS, EAP-TLS, wired 802.1X)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the version-skew checks read the 1.0.1 agent and renderer from its tag
      - name: Real FreeRADIUS with the rendered configuration, real EAP-TLS
        run: tests/radius/run.sh
